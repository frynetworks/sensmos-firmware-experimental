; SENSMOS ESP8266 port — based on Galusz/sensmos-firmware (ESP32)
[env:nodemcuv2]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
; 160 MHz: nie zmienia mapy RAM, ale skraca okna szczytowej alokacji (TLS/JSON/crypto)
; — mniej zdarzen fragmentacji przy tym samym heapie.
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
; WEBSOCKETS_MAX_DATA_SIZE: cap reject-before-malloc na ramki INBOUND (WebSockets.cpp:438;
; alokacja jest per-ramka wg payloadLen — cap NIE oszczedza heapu, ogranicza najwiekszy
; wymuszalny malloc). Naglowek biblioteki definiowal 15KB bez #ifndef, wiec ta flaga byla
; MARTWA do 2026-08-24 — patch_websockets_tls.py owija define w #ifndef i flaga wygrywa.
; 4KB floor: plaintext `identified` catalog mierzyl 3686B (2026-08-18); 2KB lamalo handshake.
; WEBSOCKETS_SAVE_RAM: naglowki WS do flasha (-476B RAM).
; MMU: 16KB icache + 48KB IRAM z drugim heapem (SECHEAP_SHARED). Kod .text1 = ~28KB,
; wiec ~19KB IRAM zostaje jako drugi heap na bulk-bufory (HeapSelectIram w net_worker/
; tunnel). Koszt: polowa icache — mierzone gate'em, brak regresji stabilnosci.
;
; TLS (od 2026-08-24 DOMYSLNIE w shippingu): SENSMOS_USE_TLS wlacza trwaly transport
; wss:// przez wolfSSL (WsTlsClient, pinning ISRG Root YE — patrz ca_cert.h). Konfiguracja wolfSSL-a z
; tools/patch_wolfssl_settings.py (pre-hook; -D nie przebija user_settings.h pakietu).
; relocate_wolfssl_rodata: ~26KB .rodata wolfSSL-a do irom0 (bez tego ~1.2KB heapu na
; boot = reset-loop). patch_websockets_tls: klasa SSL biblioteki -> WsTlsClient + guard
; MAX_DATA_SIZE. Szyfrowanie aplikacyjne ws_enc dziala bez zmian POD TLS-em.
extra_scripts =
    pre:tools/patch_wolfssl_settings.py
    pre:tools/patch_websockets_tls.py
    pre:tools/check_cert_expiry.py
    post:tools/relocate_wolfssl_rodata.py
build_flags = -DFW_IS_ESP8266 -DWEBSOCKETS_MAX_DATA_SIZE=4096 -DWEBSOCKETS_SAVE_RAM -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED -DSENSMOS_USE_TLS -DWOLFSSL_USER_SETTINGS
lib_deps =
    links2004/WebSockets@^2.7.3
    bblanchon/ArduinoJson@^7.0.0
    kmackay/micro-ecc@^1.0.0
    wolfssl/wolfssl@^5.7.2

; Debug-only env: adds the flag-gated WiFi deep diagnostics (config.h WIFI_DEEP_DIAG).
; Dziedziczy TLS (extends + interpolacja build_flags).
[env:nodemcuv2_diag]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -DWIFI_DEEP_DIAG=1

; Legacy alias — TLS jest teraz domyslne w nodemcuv2; historyczne skrypty/doki, ktore
; buduja `-e nodemcuv2_tls`, dostaja identyczny obraz co shipping.
[env:nodemcuv2_tls]
extends = env:nodemcuv2
